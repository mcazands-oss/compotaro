<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texas Hold'em Layout Test</title>
  <link rel="stylesheet" href="/holdem/styles.css">
  <style>
    body { overflow: hidden; }
  </style>
</head>
<body>
  <div class="game-page">
    <!-- HUD -->
    <div class="game-hud">
      <div class="hud-left">
        <div class="hud-level">Level 1</div>
        <div class="hud-blinds">
          <span class="blind-dot sb-dot"></span>
          <span id="hud-blinds">$100 / $200</span>
          <span class="blind-dot bb-dot"></span>
        </div>
      </div>
      <div class="hud-center">
        <div class="hud-logo">♠ Compotaro ♥</div>
        <div class="hud-timer-wrap">
          Next level: <span class="hud-timer">15:00</span>
          <div class="hud-blind-progress">
            <div class="hud-blind-bar" style="width:0%"></div>
          </div>
        </div>
      </div>
      <div class="hud-right">
        <div class="hud-players">8 players</div>
        <div class="hud-hand">Hand #1</div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-container">
      <div class="table" id="poker-table">
        <div class="table-felt"></div>

        <!-- Dealer button at seat 0 position -->
        <div class="dealer-btn" id="dealer-button" data-near="0">D</div>

        <!-- ONLY SEAT 0 for testing -->
        <div class="seat hero" data-seat="0">
          <div class="action-indicator"></div>
          <div class="seat-hole-cards">
            <div class="card" style="width:52px;height:74px;background:white;border:1px solid #ccc;border-radius:5px;display:flex;align-items:center;justify-content:center;">♠K</div>
            <div class="card" style="width:52px;height:74px;background:white;border:1px solid #ccc;border-radius:5px;display:flex;align-items:center;justify-content:center;">♥Q</div>
          </div>
          <div class="seat-info">
            <div class="seat-avatar">Y</div>
            <div class="seat-name">You</div>
            <div class="seat-stack">$3,500</div>
            <div class="seat-status"></div>
          </div>
          <div class="seat-bet" style="display:none"></div>
          <div class="action-timer"><div class="action-timer-bar" style="width:100%"></div></div>
        </div>

        <!-- Table center -->
        <div class="table-center">
          <div class="community-cards" id="community-cards">
            <div class="community-card-slot"></div>
            <div class="community-card-slot"></div>
            <div class="community-card-slot"></div>
            <div class="community-card-slot"></div>
            <div class="community-card-slot"></div>
          </div>
          <div class="pot-display">
            <span class="pot-label">Pot</span>
            <span class="pot-amount" id="pot-amount">$1,200</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Panel -->
    <div class="action-panel" id="action-panel">
      <div class="action-info">Your turn to act</div>
      <div class="action-buttons">
        <button class="action-btn btn-fold">Fold</button>
        <button class="action-btn btn-check">Check</button>
        <button class="action-btn btn-raise">Bet</button>
        <button class="action-btn btn-allin">All-In</button>
      </div>
    </div>
  </div>
</body>
</html>
